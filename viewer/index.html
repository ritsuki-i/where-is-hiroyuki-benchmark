<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ひろゆきを探せ | Benchmark Replay</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10151a;color:#f5f5ee}body{margin:0}main{max-width:1100px;margin:auto;padding:30px}h1{font-size:clamp(1.8rem,4vw,3rem);margin:.2em 0}p{color:#b4c1c4;line-height:1.7}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}.tag{color:#fcde70;letter-spacing:.15em;font-size:.75rem}section{background:#1c252a;padding:18px;border-radius:16px}canvas{width:100%;height:auto;background:#111;border-radius:8px;display:block}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}button,.file{background:#f5d764;color:#1a211f;border:0;border-radius:8px;padding:12px 18px;font-weight:bold;cursor:pointer}button:disabled{opacity:.45;cursor:default}.file input{max-width:260px}#status{color:#c7d5d4;font-size:.9rem}small{color:#aab9bb}
</style></head><body><main><header><div><span class="tag">FIND HIROYUKI / BENCHMARK</span><h1>ひろゆきを探せ</h1><p>5つのステージを振り返る、モデルの探索記録。</p></div></header><section><canvas id="screen" width="1280" height="800"></canvas><div class="controls"><label class="file">結果 JSON を選択 <input id="file" type="file" accept="application/json,.json"></label><button id="play">再生</button><button id="save">動画を保存</button><span id="status">結果未読込：正解のプレビューを表示中</span></div><p><small>再生は各ステージの結果を順に表示するダイジェストです。モデルの推論過程の録画ではありません。動画保存は WebM 対応ブラウザで利用できます。</small></p></section></main><script>
const canvas=document.querySelector('#screen'), ctx=canvas.getContext('2d'), status=document.querySelector('#status');
let manifest=[], result=null, images=[], recording=false, playing=false;
const loadImage=src=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src});
function draw(index){const item=manifest[index], image=images[index]; if(!item||!image)return; ctx.fillStyle='#10191e';ctx.fillRect(0,0,1280,800);const scale=Math.min(1220/image.width,650/image.height),w=image.width*scale,h=image.height*scale,x=(1280-w)/2,y=90+(650-h)/2;ctx.drawImage(image,x,y,w,h);let [x1,y1,x2,y2]=item.bbox_xyxy_exclusive;ctx.strokeStyle='#ffdf66';ctx.lineWidth=4;ctx.strokeRect(x+x1*scale,y+y1*scale,(x2-x1)*scale,(y2-y1)*scale);ctx.fillStyle='#f7f6eb';ctx.font='bold 30px sans-serif';ctx.fillText(`STAGE 0${index+1}  /  ${result?.model || 'PREVIEW'}`,30,48);let row=result?.stages.find(r=>r.stage===item.id);ctx.font='22px sans-serif';ctx.fillText(row?`IoU ${Number(row.iou).toFixed(3)}   |   ${Number(row.seconds).toFixed(2)} sec   |   ${row.error?'ERROR':row.success?'FOUND':'MISSED'}`:'正解位置のプレビュー',30,780)}
async function run(){if(playing)return;playing=true;document.querySelector('#play').disabled=true;for(let i=0;i<manifest.length;i++){draw(i);await new Promise(r=>setTimeout(r,2500))}playing=false;document.querySelector('#play').disabled=false}
document.querySelector('#file').onchange=async e=>{try{const value=JSON.parse(await e.target.files[0].text());if(typeof value.model!=='string'||!Array.isArray(value.stages)||!manifest.every(m=>value.stages.some(r=>r.stage===m.id&&Number.isFinite(r.iou)&&Number.isFinite(r.seconds))))throw Error('5ステージの結果が必要です');result=value;status.textContent=`読込済み：${result.model}`;draw(0)}catch(err){status.textContent='読込エラー：'+err.message}};
document.querySelector('#play').onclick=run;
document.querySelector('#save').onclick=async()=>{if(playing||recording)return;if(!window.MediaRecorder||!canvas.captureStream){status.textContent='このブラウザは動画保存に対応していません';return}recording=true;const stream=canvas.captureStream(30),rec=new MediaRecorder(stream),chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{const url=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType}));const a=document.createElement('a');a.href=url;a.download='hiroyuki-replay.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);stream.getTracks().forEach(t=>t.stop());recording=false};rec.start();await run();rec.stop()};
(async()=>{try{const response=await fetch('../data/annotations/manifest.json');if(!response.ok)throw Error('manifest');manifest=await response.json();images=await Promise.all(manifest.map(m=>loadImage('../'+m.image)));draw(0)}catch(e){status.textContent='データを読めません。READMEの手順でローカルサーバーを起動してください。'}})();
</script></body></html>
